services:
  postgres:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    container_name: shop-postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: my-postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"


volumes:
  postgres_data:
